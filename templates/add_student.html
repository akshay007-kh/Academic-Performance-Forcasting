{% load static %}

<!DOCTYPE html>
<html>

<head>

    <title>Add Student</title>

    <link rel="stylesheet"
          href="{% static 'css/style.css' %}">

</head>

<body>

<div class="page-container">

    <div class="form-card">

        <h2>Add New Student</h2>

        <p class="form-description">
            Enter the student's basic details.
        </p>

        {% if error %}
            <div class="error">
                {{ error }}
            </div>
        {% endif %}

        <form method="POST">

            {% csrf_token %}

            <div class="form-row">

                <div class="form-group">

                    <label>Student ID</label>

                    <input
                        type="text"
                        name="student_id"
                        placeholder="ST001"
                        required>

                </div>

                <div class="form-group">

                    <label>Full Name</label>

                    <input
                        type="text"
                        name="name"
                        placeholder="Enter name"
                        required>

                </div>

            </div>


            <div class="form-row">

                <div class="form-group">

                    <label>Email</label>

                    <input
                        type="email"
                        name="email"
                        required>

                </div>

                <div class="form-group">

                    <label>Phone</label>

                    <input
                        type="text"
                        name="phone"
                        required>

                </div>

            </div>


            <div class="form-row">

                <div class="form-group">

                    <label>Course</label>

                    <input
                        type="text"
                        name="course"
                        placeholder="B.Tech CSE"
                        required>

                </div>

                <div class="form-group">

                    <label>Department</label>

                    <select name="department" required>

                        <option value="">
                            Select Department
                        </option>

                        <option value="Computer Science">
                            Computer Science
                        </option>

                        <option value="Information Technology">
                            Information Technology
                        </option>

                        <option value="Electronics">
                            Electronics
                        </option>

                        <option value="Mechanical">
                            Mechanical
                        </option>

                        <option value="Civil">
                            Civil
                        </option>

                    </select>

                </div>

            </div>


            <div class="form-row">

                <div class="form-group">

                    <label>Semester</label>

                    <input
                        type="number"
                        name="semester"
                        min="1"
                        max="10"
                        required>

                </div>

                <div class="form-group">

                    <label>Batch</label>

                    <input
                        type="text"
                        name="batch"
                        placeholder="2024-2028"
                        required>

                </div>

            </div>


            <div class="form-actions">

                <button
                    type="submit"
                    class="btn-primary">

                    Add Student

                </button>

                <a
                    href="{% url 'student_list' %}"
                    class="btn-secondary">

                    Cancel

                </a>

            </div>

        </form>

    </div>

</div>

</body>

</html>
