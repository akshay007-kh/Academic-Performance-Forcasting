{% load static %}

<!DOCTYPE html>
<html>

<head>

    <title>Add Staff</title>

    <link rel="stylesheet"
          href="{% static 'css/style.css' %}">

</head>

<body>

<div class="page-container">

    <div class="form-card">

        <h2>Add New Staff</h2>

        <p class="form-description">
            Create a staff account for the Academic
            Performance Forecasting System.
        </p>


        {% if error %}

            <div class="error">
                {{ error }}
            </div>

        {% endif %}


        <form method="POST">

            {% csrf_token %}


            <div class="form-row">

                <div class="form-group">

                    <label>Full Name</label>

                    <input
                        type="text"
                        name="name"
                        placeholder="Enter full name"
                        required>

                </div>


                <div class="form-group">

                    <label>Username</label>

                    <input
                        type="text"
                        name="username"
                        placeholder="Enter username"
                        required>

                </div>

            </div>


            <div class="form-row">

                <div class="form-group">

                    <label>Email</label>

                    <input
                        type="email"
                        name="email"
                        placeholder="Enter email"
                        required>

                </div>


                <div class="form-group">

                    <label>Phone</label>

                    <input
                        type="text"
                        name="phone"
                        placeholder="Enter phone number"
                        required>

                </div>

            </div>


            <div class="form-group">

                <label>Department</label>

                <select name="department" required>

                    <option value="">
                        Select Department
                    </option>

                    <option value="Computer Science">
                        Computer Science
                    </option>

                    <option value="Information Technology">
                        Information Technology
                    </option>

                    <option value="Electronics">
                        Electronics
                    </option>

                    <option value="Mechanical">
                        Mechanical
                    </option>

                    <option value="Civil">
                        Civil
                    </option>

                </select>

            </div>


            <div class="form-group">

                <label>Password</label>

                <input
                    type="password"
                    name="password"
                    placeholder="Create password"
                    required>

            </div>


            <div class="form-actions">

                <button
                    type="submit"
                    class="btn-primary">

                    Add Staff

                </button>


                <a
                    href="{% url 'staff_list' %}"
                    class="btn-secondary">

                    Cancel

                </a>

            </div>

        </form>

    </div>

</div>

</body>

</html>
