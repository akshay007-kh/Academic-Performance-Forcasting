{% load static %}

<!DOCTYPE html>
<html>

<head>

    <title>Edit Academic Record</title>

    <link rel="stylesheet"
          href="{% static 'css/style.css' %}">

</head>

<body>

<div class="page-container">

    <div class="form-card">

        <h2>Edit Academic Record</h2>

        <p class="form-description">
            Update the student's academic details.
        </p>

        <form method="POST">

            {% csrf_token %}

            <div class="form-group">

                <label>Student</label>

                <select name="student" required>

                    {% for student in students %}

                    <option
                        value="{{ student.id }}"
                        {% if student.id == record.student.id %}
                            selected
                        {% endif %}>

                        {{ student.student_id }} -
                        {{ student.name }}

                    </option>

                    {% endfor %}

                </select>

            </div>

            <div class="form-row">

                <div class="form-group">

                    <label>Semester</label>

                    <input
                        type="number"
                        name="semester"
                        value="{{ record.semester }}"
                        min="1"
                        max="10"
                        required>

                </div>

                <div class="form-group">

                    <label>Attendance (%)</label>

                    <input
                        type="number"
                        name="attendance"
                        value="{{ record.attendance }}"
                        min="0"
                        max="100"
                        step="0.01"
                        required>

                </div>

            </div>

            <div class="form-row">

                <div class="form-group">

                    <label>Internal Marks</label>

                    <input
                        type="number"
                        name="internal_marks"
                        value="{{ record.internal_marks }}"
                        min="0"
                        max="100"
                        step="0.01"
                        required>

                </div>

                <div class="form-group">

                    <label>Assignment Marks</label>

                    <input
                        type="number"
                        name="assignment_marks"
                        value="{{ record.assignment_marks }}"
                        min="0"
                        max="100"
                        step="0.01"
                        required>

                </div>

            </div>

            <div class="form-row">

                <div class="form-group">

                    <label>Previous Marks</label>

                    <input
                        type="number"
                        name="previous_marks"
                        value="{{ record.previous_marks }}"
                        min="0"
                        max="100"
                        step="0.01"
                        required>

                </div>

                <div class="form-group">

                    <label>Study Hours / Day</label>

                    <input
                        type="number"
                        name="study_hours"
                        value="{{ record.study_hours }}"
                        min="0"
                        max="24"
                        step="0.5"
                        required>

                </div>

            </div>

            <div class="form-row">

                <div class="form-group">

                    <label>Backlogs</label>

                    <input
                        type="number"
                        name="backlogs"
                        value="{{ record.backlogs }}"
                        min="0"
                        required>

                </div>

                <div class="form-group">

                    <label>Participation (%)</label>

                    <input
                        type="number"
                        name="participation"
                        value="{{ record.participation }}"
                        min="0"
                        max="100"
                        step="0.01"
                        required>

                </div>

            </div>

            <div class="form-actions">

                <button
                    type="submit"
                    class="btn-primary">

                    Update Record

                </button>

                <a
                    href="{% url 'academic_records' %}"
                    class="btn-secondary">

                    Cancel

                </a>

            </div>

        </form>

    </div>

</div>

</body>

</html>
